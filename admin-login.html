<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- Import map: lets js/firebase.js use real npm-style specifiers like
     "firebase/app" and "firebase/app-check" (the exact modular v9+
     import syntax) while this stays a plain static site with no
     bundler — the browser resolves these bare names to Google's CDN
     URLs directly. Must appear before any <script type="module">. -->
<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js",
    "firebase/app-check": "https://www.gstatic.com/firebasejs/12.16.0/firebase-app-check.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js"
  }
}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login | Community Secondary School, Ido</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="auth-shell">
  <div style="width:100%;max-width:440px;">
    <div class="auth-brand">
      <img src="assets/logo-placeholder.svg" alt="School logo" data-brand="logo" />
      <div class="brand-name" style="font-size:1.1rem;" data-brand="name">Community Secondary School, Ido</div>
      <div style="color:var(--ink-soft);font-size:0.85rem;">Administrator Login</div>
    </div>

    <div class="form-card" style="max-width:100%;">
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="admin@csido.edu.ng" autocomplete="username" required />
          <div class="field-error" id="err-email"></div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
          <div class="field-error" id="err-password"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Login to Dashboard</button>
      </form>

      <div class="link-row">
        <a href="#" id="forgotLink">Forgot your password?</a>
      </div>
      <div class="link-row">
        <a href="index.html">← Back to home</a> &middot; <a href="privacy-policy.html">Privacy Policy</a>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/admin-login.js"></script>
</body>
</html>
